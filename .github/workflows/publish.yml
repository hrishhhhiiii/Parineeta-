# The admin's Publish button: asks the host (Cloudflare Pages) to rebuild the site with the newly
# published content, and reports progress back to the admin panel. Code pushes to main are built by
# the host's own GitHub connection, so they don't come through here.
# Also pings Supabase daily so the free project never pauses for inactivity.
#
# GitHub → Settings → Environments → production:
#   secret   DEPLOY_HOOK         Cloudflare's deploy hook (Workers & Pages → parineeta → Settings → Builds → Deploy Hooks)
#   secret   VERCEL_DEPLOY_HOOK  Vercel's deploy hook, while the Vercel copy of the site still runs
#   variable SUPABASE_URL, SUPABASE_ANON_KEY (or the same values named VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY)
name: publish

on:
  repository_dispatch:
    types: [cms-publish]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase so the free project doesn't pause
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY variables."; exit 1; fi
          curl -fsS "$SUPABASE_URL/rest/v1/published_content?select=key&limit=1" -H "apikey: $SUPABASE_ANON_KEY" > /dev/null

  publish:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: website
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      JOB_ID: ${{ github.event.client_payload.job_id }}
      JOB_SECRET: ${{ github.event.client_payload.secret }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Runs before checkout, so not in website/ (it doesn't exist yet).
      - name: Mask the job secret
        if: env.JOB_SECRET != ''
        working-directory: .
        run: echo "::add-mask::$JOB_SECRET"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/mark-job.mjs building

      - name: Check the published content is readable (so a broken publish fails here, not on the host)
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/published_content?select=key&limit=1" -H "apikey: $SUPABASE_ANON_KEY" > /dev/null

      # Every host that has a hook rebuilds: DEPLOY_HOOK (Cloudflare) and VERCEL_DEPLOY_HOOK (Vercel, while both run).
      - name: Ask the hosts to rebuild the site
        env:
          CLOUDFLARE_HOOK: ${{ secrets.DEPLOY_HOOK }}
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_HOOK$VERCEL_HOOK" ]; then echo "::error::Add the DEPLOY_HOOK secret (the host's deploy hook address)."; exit 1; fi
          if [ -n "$CLOUDFLARE_HOOK" ]; then curl -fsS -X POST "$CLOUDFLARE_HOOK" > /dev/null && echo "Cloudflare is rebuilding the site."; fi
          if [ -n "$VERCEL_HOOK" ]; then curl -fsS -X POST "$VERCEL_HOOK" > /dev/null && echo "Vercel is rebuilding the site."; fi
          echo "It is usually live within 2 minutes."

      - name: Mark live
        env:
          DEPLOY_URL: ${{ vars.SITE_URL }}
        run: node scripts/mark-job.mjs live

      - name: Mark failed
        if: failure()
        run: node scripts/mark-job.mjs failed "The site update failed. Open the run log for details."
