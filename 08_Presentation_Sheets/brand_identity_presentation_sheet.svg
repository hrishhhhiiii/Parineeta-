<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      
      .brand-title {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 130px;
        font-weight: 800;
        fill: #800e19;
        letter-spacing: -2px;
      }
      .brand-title-accent {
        fill: #dfaa44;
      }
      .brand-tagline {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 32px;
        font-weight: 600;
        fill: #997526;
        letter-spacing: 5px;
      }
      .sheet-label {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #999999;
      }
    </style>

    <!-- Linear Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d49a2a"/>
      <stop offset="100%" stop-color="#b87b12"/>
    </linearGradient>

    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a0f1c"/>
      <stop offset="100%" stop-color="#54050d"/>
    </linearGradient>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#800e19" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Pure White Background -->
  <rect width="1800" height="1000" fill="#ffffff"/>

  <!-- ========================================== -->
  <!-- LEFT: MINIMALIST MONOGRAM EMBLEM           -->
  <!-- ========================================== -->
  <g id="left-monogram" transform="translate(230, 480)">
    <!-- Label -->
    <text x="0" y="320" text-anchor="middle" class="sheet-label">01. Monogram Emblem</text>

    <!-- Top Ornaments: Bridal Mukut (Left) & Groom Topor (Right) -->
    <!-- Mukut on Left -->
    <g transform="translate(-65, -195) scale(0.95)" fill="#800e19">
      <path d="M 0,0 C -15,-25 -40,-35 -55,-10 C -45,15 -15,20 0,25 C 15,20 45,15 55,-10 C 40,-35 15,-25 0,0 Z"/>
      <path d="M 0,-40 C -8,-20 -20,0 0,15 C 20,0 8,-20 0,-40 Z"/>
      <circle cx="0" cy="-45" r="4.5"/>
      <circle cx="-35" cy="-22" r="3.5"/>
      <circle cx="35" cy="-22" r="3.5"/>
      <circle cx="-55" cy="-5" r="3"/>
      <circle cx="55" cy="-5" r="3"/>
    </g>

    <!-- Topor on Right -->
    <g transform="translate(60, -195) scale(0.85)" fill="#800e19">
      <!-- Conical Tiered Topor -->
      <path d="M 0,-50 C 6,-35 8,-15 15,0 L -15,0 C -8,-15 -6,-35 0,-50 Z"/>
      <circle cx="0" cy="-56" r="4"/>
      <!-- Bird on top -->
      <path d="M 0,-62 C 4,-66 8,-64 9,-60 C 9,-57 6,-55 3,-56 Z"/>
      <!-- Tiers -->
      <rect x="-24" y="0" width="48" height="14" rx="5"/>
      <rect x="-32" y="18" width="64" height="15" rx="5"/>
      <rect x="-42" y="37" width="84" height="17" rx="5"/>
    </g>

    <!-- Monogram Base: Bengali Letter 'প' + Paan Pata Leaf -->
    <!-- Bengali 'প' Letterform in Royal Crimson -->
    <g fill="#800e19">
      <!-- Horizontal Matra Bar -->
      <rect x="-105" y="-125" width="210" height="24" rx="6"/>
      
      <!-- 'প' Left Arch and Body -->
      <path d="M -100,-115 C -95,-60 -115,20 -60,65 C -25,95 25,95 60,65 C 40,40 10,40 -15,35 C -45,30 -60,-10 -55,-105 L -20,-105 C -25,-40 -15,0 10,5 C 20,7 28,5 35,0 L 35,-115 L 75,-115 L 75,95 C 40,125 -30,135 -75,90 C -120,45 -135,-40 -130,-115 Z"/>
    </g>

    <!-- Betel Leaf (Paan Pata) integrated on Right of 'প' -->
    <g transform="translate(60, 35) scale(1.15)">
      <!-- Leaf Silhouette in Crimson -->
      <path d="M 0,-70 C 35,-65 55,-25 35,25 C 20,55 0,75 0,75 C 0,75 -20,55 -35,25 C -55,-25 -35,-65 0,-70 Z" fill="#800e19"/>
      <!-- Internal Leaf Veins (White Cutout) -->
      <path d="M 0,-50 C 4,-15 5,15 0,55" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 0,-25 Q 18,-35 25,-15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 0,-25 Q -18,-35 -25,-15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 0,0 Q 18,-8 22,12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 0,0 Q -18,-8 -22,12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="-56" r="3.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- CENTER: FULL HORIZONTAL LOGO LOCKUP        -->
  <!-- ========================================== -->
  <g id="center-lockup" transform="translate(860, 480)">
    <!-- Label -->
    <text x="0" y="320" text-anchor="middle" class="sheet-label">02. Primary Horizontal Lockup</text>

    <!-- Small Monogram Icon on Top/Left of Wordmark -->
    <g transform="translate(-320, -50) scale(0.48)">
      <!-- Mukut & Topor -->
      <g transform="translate(-50, -170)" fill="#800e19">
        <path d="M 0,0 C -15,-20 -35,-30 -48,-8 C -40,12 -12,18 0,20 C 12,18 40,12 48,-8 C 35,-30 15,-20 0,0 Z"/>
        <path d="M 0,-35 C -6,-15 -15,0 0,12 C 15,0 6,-15 0,-35 Z"/>
      </g>
      <g transform="translate(50, -170)" fill="#800e19">
        <path d="M 0,-40 L 12,0 L -12,0 Z"/>
        <rect x="-18" y="0" width="36" height="10" rx="3"/>
        <rect x="-25" y="14" width="50" height="12" rx="4"/>
      </g>
      <!-- Base 'প' and Paan -->
      <path d="M -80,-100 L 60,-100 L 60,-80 L -30,-80 C -25,-20 -10,20 15,20 L 15,70 C -35,70 -65,20 -70,-50 Z" fill="#800e19"/>
      <path d="M 50,-10 C 70,-8 85,15 70,45 C 60,65 50,75 50,75 C 50,75 40,65 30,45 C 15,15 30,-8 50,-10 Z" fill="#800e19"/>
      <path d="M 50,5 L 50,55" stroke="#fff" stroke-width="3"/>
    </g>

    <!-- Brand Typography "পরিণীতা" -->
    <text x="20" y="0" text-anchor="middle">
      <tspan class="brand-title">পরি</tspan><tspan class="brand-title brand-title-accent">ণীতা</tspan>
    </text>

    <!-- Tagline "এ যেন এক বিয়ের মরশুম" -->
    <text x="20" y="80" text-anchor="middle" class="brand-tagline">এ যেন এক বিয়ের মরশুম</text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT: ROUNDED SQUARE APP ICON BADGE      -->
  <!-- ========================================== -->
  <g id="right-badge" transform="translate(1500, 480)">
    <!-- Label -->
    <text x="0" y="320" text-anchor="middle" class="sheet-label">03. App Icon / Hallmark</text>

    <!-- Squircle / Rounded Square Badge -->
    <rect x="-135" y="-135" width="270" height="270" rx="60" fill="url(#crimsonGrad)" filter="url(#badgeShadow)"/>

    <!-- Subtle Inner Border -->
    <rect x="-130" y="-130" width="260" height="260" rx="55" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

    <!-- Gold & White Monogram inside App Icon -->
    <g transform="translate(0, 15) scale(0.65)">
      <!-- Mukut (White Shola) -->
      <g transform="translate(-55, -170)" fill="#ffffff">
        <path d="M 0,0 C -15,-20 -35,-30 -48,-8 C -40,12 -12,18 0,20 C 12,18 40,12 48,-8 C 35,-30 15,-20 0,0 Z"/>
        <path d="M 0,-35 C -6,-15 -15,0 0,12 C 15,0 6,-15 0,-35 Z"/>
        <circle cx="0" cy="-40" r="4"/>
      </g>

      <!-- Topor (White Shola + Gold Bird) -->
      <g transform="translate(55, -170)">
        <path d="M 0,-40 L 12,0 L -12,0 Z" fill="#ffffff"/>
        <rect x="-18" y="0" width="36" height="10" rx="3" fill="#ffffff"/>
        <rect x="-26" y="14" width="52" height="12" rx="4" fill="#ffffff"/>
        <circle cx="0" cy="-45" r="4" fill="url(#goldGrad)"/>
      </g>

      <!-- Monogram 'প' in Pure Gold -->
      <g fill="url(#goldGrad)">
        <rect x="-95" y="-115" width="190" height="20" rx="5"/>
        <path d="M -85,-105 C -80,-55 -100,15 -50,55 C -20,80 20,80 50,55 C 35,35 10,35 -10,30 C -35,25 -50,-10 -45,-95 L -15,-95 C -20,-40 -10,-5 10,0 C 18,2 25,0 30,-5 L 30,-105 L 65,-105 L 65,80 C 35,105 -25,115 -65,75 C -105,35 -115,-40 -110,-105 Z"/>
      </g>

      <!-- Betel Leaf (Paan Pata) in Pure Gold with White Veins -->
      <g transform="translate(55, 30) scale(1.05)">
        <path d="M 0,-60 C 30,-55 48,-20 30,20 C 18,45 0,65 0,65 C 0,65 -18,45 -30,20 C -48,-20 -30,-55 0,-60 Z" fill="url(#goldGrad)"/>
        <!-- Inner White Sandalwood Veins -->
        <path d="M 0,-42 C 3,-12 4,12 0,45" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M 0,-20 Q 15,-28 20,-10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M 0,-20 Q -15,-28 -20,-10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <circle cx="0" cy="-48" r="3" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- Bottom Divider Line & Footer Info -->
  <line x1="120" y1="880" x2="1680" y2="880" stroke="#eeeeee" stroke-width="2"/>
  <text x="120" y="930" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#333333">PARINEETA (পরিণীতা) — BRAND IDENTITY KIT</text>
  <text x="1680" y="930" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#888888">Bengali Wedding Luxury Theme • 100% Vector Asset</text>
</svg>
