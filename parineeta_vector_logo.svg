<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#730e18"/>
      <stop offset="65%" stop-color="#4d050c"/>
      <stop offset="100%" stop-color="#2d0206"/>
    </radialGradient>

    <radialGradient id="goldPlate" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="25%" stop-color="#dfaa44"/>
      <stop offset="50%" stop-color="#c1831c"/>
      <stop offset="75%" stop-color="#ebc775"/>
      <stop offset="100%" stop-color="#8a5308"/>
    </radialGradient>

    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae08c"/>
      <stop offset="30%" stop-color="#d49a2a"/>
      <stop offset="60%" stop-color="#fdf0b0"/>
      <stop offset="85%" stop-color="#b87b12"/>
      <stop offset="100%" stop-color="#fad675"/>
    </linearGradient>

    <linearGradient id="sariRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8111e"/>
      <stop offset="50%" stop-color="#d62232"/>
      <stop offset="100%" stop-color="#7a0a14"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&amp;family=Noto+Serif+Bengali:wght@600;700;800&amp;display=swap');
      .title-text {
        font-family: 'Noto Serif Bengali', 'Tiro Bangla', serif;
        font-size: 88px;
        font-weight: 800;
        fill: url(#goldLinear);
        letter-spacing: 2px;
        filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.7));
      }
      .subtitle-text {
        font-family: 'Noto Serif Bengali', 'Tiro Bangla', serif;
        font-size: 26px;
        font-weight: 600;
        fill: #fce7b2;
        letter-spacing: 3px;
        opacity: 0.95;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1000" fill="url(#bgGradient)"/>

  <!-- Ornate Alpana Outer Petals (Repeating Radial Pattern) -->
  <g transform="translate(500,500)" stroke="url(#goldLinear)" fill="none" opacity="0.85">
    <!-- Repeating 16 Mandala Units -->
    <g id="mandala-unit">
      <!-- 16 leaves -->
      <path d="M 0,-470 C 25,-445 40,-410 0,-380 C -40,-410 -25,-445 0,-470 Z" fill="url(#goldLinear)" opacity="0.75" />
      <circle cx="0" cy="-440" r="4" fill="#ffffff" />
      <path d="M 0,-470 Q 30,-485 55,-460" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0,-470 Q -30,-485 -55,-460" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="55" cy="-460" r="3.5" fill="#fadc78" />
      <circle cx="-55" cy="-460" r="3.5" fill="#fadc78" />
      <path d="M -25,-380 C -60,-350 -40,-310 0,-290 C 40,-310 60,-350 25,-380" stroke="url(#goldLinear)" stroke-width="2"/>
    </g>
    <!-- Rotations -->
    <use href="#mandala-unit" transform="rotate(22.5)" />
    <use href="#mandala-unit" transform="rotate(45)" />
    <use href="#mandala-unit" transform="rotate(67.5)" />
    <use href="#mandala-unit" transform="rotate(90)" />
    <use href="#mandala-unit" transform="rotate(112.5)" />
    <use href="#mandala-unit" transform="rotate(135)" />
    <use href="#mandala-unit" transform="rotate(157.5)" />
    <use href="#mandala-unit" transform="rotate(180)" />
    <use href="#mandala-unit" transform="rotate(202.5)" />
    <use href="#mandala-unit" transform="rotate(225)" />
    <use href="#mandala-unit" transform="rotate(247.5)" />
    <use href="#mandala-unit" transform="rotate(270)" />
    <use href="#mandala-unit" transform="rotate(292.5)" />
    <use href="#mandala-unit" transform="rotate(315)" />
    <use href="#mandala-unit" transform="rotate(337.5)" />
  </g>

  <!-- Ornate Outer Rings -->
  <circle cx="500" cy="500" r="415" fill="none" stroke="url(#goldLinear)" stroke-width="4" filter="url(#dropShadow)"/>
  <circle cx="500" cy="500" r="405" fill="none" stroke="#f6da7a" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.8"/>
  <circle cx="500" cy="500" r="392" fill="none" stroke="url(#goldLinear)" stroke-width="3"/>

  <!-- Inner Crimson Medallion Background with subtle texture -->
  <circle cx="500" cy="500" r="385" fill="#4d060c" stroke="#d49a2a" stroke-width="2" filter="url(#dropShadow)"/>
  <circle cx="500" cy="500" r="375" fill="none" stroke="#dfaa44" stroke-width="1" opacity="0.5"/>

  <!-- Top Emblem: Bengali Bridal Mukut (Tiara) & Groom Topor Motif -->
  <g transform="translate(500, 240)" filter="url(#dropShadow)">
    <!-- Mukut Arc -->
    <path d="M -110,65 Q -60,10 -15,5 Q 0,0 15,5 Q 60,10 110,65 Q 65,45 0,40 Q -65,45 -110,65 Z" fill="url(#goldLinear)" stroke="#583100" stroke-width="1.5"/>
    <!-- Intricate Mukut Filigree Peaks -->
    <path d="M 0,-40 C 20,-10 25,25 0,40 C -25,25 -20,-10 0,-40 Z" fill="#ffffff" stroke="url(#goldLinear)" stroke-width="2"/>
    <circle cx="0" cy="-42" r="5" fill="url(#goldLinear)"/>
    <path d="M -45,-15 C -25,10 -15,30 -35,42 C -55,30 -55,0 -45,-15 Z" fill="#ffffff" stroke="url(#goldLinear)" stroke-width="1.5"/>
    <circle cx="-45" cy="-18" r="4" fill="url(#goldLinear)"/>
    <path d="M 45,-15 C 25,10 15,30 35,42 C 55,30 55,0 45,-15 Z" fill="#ffffff" stroke="url(#goldLinear)" stroke-width="1.5"/>
    <circle cx="45" cy="-18" r="4" fill="url(#goldLinear)"/>
    
    <!-- Mukut pearls & jewels -->
    <circle cx="-80" cy="40" r="3" fill="#ffffff"/>
    <circle cx="-60" cy="30" r="3.5" fill="#ffffff"/>
    <circle cx="-20" cy="22" r="4" fill="#ffffff"/>
    <circle cx="0" cy="20" r="5" fill="#d62232"/>
    <circle cx="20" cy="22" r="4" fill="#ffffff"/>
    <circle cx="60" cy="30" r="3.5" fill="#ffffff"/>
    <circle cx="80" cy="40" r="3" fill="#ffffff"/>

    <!-- Small Topor / Kalka flourish -->
    <path d="M 0,-30 Q 8,-15 0,10 Q -8,-15 0,-30 Z" fill="#d62232" opacity="0.9"/>
  </g>

  <!-- Central Brand Typography -->
  <!-- "পরিণীতা" -->
  <text x="500" y="475" text-anchor="middle" class="title-text">পরিণীতা</text>

  <!-- Tagline: "এ যেন এক বিয়ের মরশুম" -->
  <!-- Decorative Floral Divider Flanking Tagline -->
  <g transform="translate(500, 525)" stroke="url(#goldLinear)" fill="none" stroke-width="1.5">
    <line x1="-280" y1="0" x2="-190" y2="0" stroke-linecap="round"/>
    <circle cx="-185" cy="0" r="3" fill="url(#goldLinear)"/>
    <path d="M -200,-5 Q -190,-12 -180,0 Q -190,12 -200,5" stroke="url(#goldLinear)"/>

    <line x1="190" y1="0" x2="280" y2="0" stroke-linecap="round"/>
    <circle cx="185" cy="0" r="3" fill="url(#goldLinear)"/>
    <path d="M 200,-5 Q 190,-12 180,0 Q 190,12 200,5" stroke="url(#goldLinear)"/>
  </g>
  <text x="500" y="533" text-anchor="middle" class="subtitle-text">এ যেন এক বিয়ের মরশুম</text>

  <!-- Bottom Wedding Iconography: Shubho Drishti Paan Pata & Shankha-Pola Knot -->
  <g transform="translate(500, 680)" filter="url(#dropShadow)">
    <!-- Red & White Wedding Drapes (Gathbandhan / Sari-Dhoti Jor) -->
    <!-- Left Red Sari Pleats -->
    <path d="M -240,-15 C -150,-40 -70,20 -10,35 C -50,60 -150,55 -240,-15 Z" fill="url(#sariRed)" stroke="url(#goldLinear)" stroke-width="2"/>
    <!-- Gold Zari Border on red drape -->
    <path d="M -240,-15 C -150,-40 -70,20 -10,35" stroke="url(#goldLinear)" stroke-width="6" fill="none"/>
    <path d="M -240,-15 C -150,-40 -70,20 -10,35" stroke="#fff" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

    <!-- Right White-Gold Dhoti / Chadar -->
    <path d="M 240,-15 C 150,-40 70,20 10,35 C 50,60 150,55 240,-15 Z" fill="#faf5e8" stroke="url(#goldLinear)" stroke-width="2"/>
    <path d="M 240,-15 C 150,-40 70,20 10,35" stroke="url(#goldLinear)" stroke-width="6" fill="none"/>
    <path d="M 240,-15 C 150,-40 70,20 10,35" stroke="#d49a2a" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

    <!-- Auspicious Betel Leaf (Paan Pata) in Center -->
    <g transform="translate(0, 20) scale(1.1)">
      <!-- Leaf Shadow & Base -->
      <path d="M 0,-65 C 45,-60 65,-25 45,20 C 30,55 0,80 0,80 C 0,80 -30,55 -45,20 C -65,-25 -45,-60 0,-65 Z" 
            fill="url(#goldPlate)" stroke="#4d060c" stroke-width="2"/>
      <!-- Inner Chandan Kalka Artwork (Traditional White Sandalwood Paste Motifs) -->
      <!-- Center Vine -->
      <path d="M 0,-45 C 5,-20 8,10 0,60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Paisley / Kalka curls inside paan leaf -->
      <path d="M -3,-20 C -25,-25 -25,0 -5,12 C -20,18 -15,35 0,48" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.95"/>
      <path d="M 3,-20 C 25,-25 25,0 5,12 C 20,18 15,35 0,48" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.95"/>
      <!-- Chandan dots -->
      <circle cx="-15" cy="-32" r="2.2" fill="#ffffff"/>
      <circle cx="15" cy="-32" r="2.2" fill="#ffffff"/>
      <circle cx="-25" cy="-12" r="2.2" fill="#ffffff"/>
      <circle cx="25" cy="-12" r="2.2" fill="#ffffff"/>
      <circle cx="-20" cy="10" r="2" fill="#ffffff"/>
      <circle cx="20" cy="10" r="2" fill="#ffffff"/>
      <circle cx="0" cy="-52" r="3" fill="#d62232"/>
    </g>

    <!-- Shankha (Conch shell) & Pola (Red Bangle) on Right -->
    <g transform="translate(85, 30)">
      <!-- Pola (Red Coral Bangle) -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="#d62232" stroke-width="7" filter="url(#dropShadow)"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" stroke-dasharray="2,4"/>
      <!-- Shankha (White Conch Shell Bangle) -->
      <circle cx="-16" cy="4" r="22" fill="none" stroke="#ffffff" stroke-width="7"/>
      <circle cx="-16" cy="4" r="22" fill="none" stroke="url(#goldLinear)" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Traditional Sindoor Kouto / Vermilion accent on Left -->
    <g transform="translate(-85, 35)">
      <circle cx="0" cy="0" r="14" fill="#a8111e" stroke="url(#goldLinear)" stroke-width="3"/>
      <circle cx="0" cy="0" r="5" fill="#fadc78"/>
      <path d="M -18,12 Q 0,22 18,12" stroke="url(#goldLinear)" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Auspicious Bottom Lotus Petals Crest -->
  <g transform="translate(500, 850)" fill="url(#goldLinear)">
    <!-- Central Lotus Blossom -->
    <path d="M 0,-25 C 18,-5 12,15 0,25 C -12,15 -18,-5 0,-25 Z" opacity="0.95"/>
    <path d="M -12,-18 C -30,0 -18,18 0,25 C -15,12 -22,-2 -12,-18 Z" opacity="0.8"/>
    <path d="M 12,-18 C 30,0 18,18 0,25 C 15,12 22,-2 12,-18 Z" opacity="0.8"/>
    <circle cx="0" cy="32" r="3.5"/>
  </g>
</svg>
